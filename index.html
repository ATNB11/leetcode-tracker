<style>
:root{
  --accent:#00ff88;
  --accent-dim:rgba(0,255,136,0.15);
  --bg:#0a0b0f;
  --card:rgba(255,255,255,0.04);
  --card-border:rgba(255,255,255,0.08);
  --text:#e8e9ed;
  --text-dim:#8b8d98;
  --easy:#00c853;
  --medium:#ffab00;
  --hard:#ff3d5a;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:radial-gradient(circle at 20% 0%, #10131c 0%, #0a0b0f 60%);
  color:var(--text);
  min-height:100vh;
  padding:24px 16px 80px;
}
.wrap{max-width:960px;margin:0 auto;}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand h1{font-size:20px;font-weight:800;}
.brand span{color:var(--accent);}
.user-pill{
  display:flex;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--card-border);
  padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;
  backdrop-filter:blur(10px);
}
.user-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
button{font-family:inherit;cursor:pointer;border:none;}
.refresh-btn{
  background:var(--card);border:1px solid var(--card-border);color:var(--text);
  padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:6px;transition:.2s;backdrop-filter:blur(10px);
}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent);}
.refresh-btn.spinning svg{animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.glass{
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:18px;
  backdrop-filter:blur(16px);
  animation:fadeUp .5s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

.dashboard{
  display:grid;
  grid-template-columns:180px 1fr;
  gap:20px;
  padding:24px;
  margin-bottom:22px;
}
@media(max-width:640px){.dashboard{grid-template-columns:1fr;}}
.ring-box{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
.ring{position:relative;width:150px;height:150px;}
.ring svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:rgba(255,255,255,0.06);stroke-width:10;}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;
  filter:drop-shadow(0 0 6px var(--accent));
  transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1);}
.ring-label{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-label .n{font-size:28px;font-weight:800;}
.ring-label .t{font-size:11px;color:var(--text-dim);}

.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-content:center;}
.stat-card{
  background:rgba(255,255,255,0.03);border:1px solid var(--card-border);
  border-radius:12px;padding:14px;text-align:center;
}
.stat-card .num{font-size:22px;font-weight:800;}
.stat-card .lbl{font-size:11px;color:var(--text-dim);margin-top:2px;text-transform:uppercase;letter-spacing:.04em;}
.stat-card.easy .num{color:var(--easy);}
.stat-card.medium .num{color:var(--medium);}
.stat-card.hard .num{color:var(--hard);}
.stat-card.total{grid-column:1/-1;background:linear-gradient(135deg,var(--accent-dim),transparent);}
.stat-card.total .num{color:var(--accent);font-size:26px;}

.tabs{display:flex;gap:8px;margin-bottom:16px;}
.tab-btn{
  background:var(--card);border:1px solid var(--card-border);color:var(--text-dim);
  padding:10px 18px;border-radius:12px;font-weight:700;font-size:14px;transition:.2s;
}
.tab-btn.active{color:#0a0b0f;background:var(--accent);border-color:var(--accent);box-shadow:0 0 16px var(--accent-dim);}

.filter-bar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.filter-btn{
  background:transparent;border:1px solid var(--card-border);color:var(--text-dim);
  padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;transition:.2s;
}
.filter-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}

.topic{margin-bottom:12px;overflow:hidden;}
.topic-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 20px;cursor:pointer;user-select:none;
}
.topic-head .left{display:flex;align-items:center;gap:10px;}
.topic-head h3{font-size:15px;font-weight:700;}
.chevron{transition:transform .25s;color:var(--text-dim);}
.topic.open .chevron{transform:rotate(90deg);}
.topic-progress{font-size:12px;color:var(--accent);font-weight:700;background:var(--accent-dim);padding:3px 10px;border-radius:999px;}
.mini-bar{height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;margin:0 20px 14px;}
.mini-bar-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .6s ease;box-shadow:0 0 6px var(--accent);}
.problem-list{max-height:0;overflow:hidden;transition:max-height .35s ease;}
.topic.open .problem-list{max-height:3000px;}
.problem-row{
  display:flex;align-items:center;gap:12px;
  padding:11px 20px;border-top:1px solid rgba(255,255,255,0.05);
  transition:background .2s;
}
.problem-row:hover{background:rgba(255,255,255,0.03);}
.problem-row.hidden-row{display:none;}
.chk{
  width:20px;height:20px;border-radius:6px;border:2px solid var(--card-border);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s;
}
.chk.solved{background:var(--accent);border-color:var(--accent);animation:pop .35s ease;box-shadow:0 0 10px var(--accent-dim);}
@keyframes pop{0%{transform:scale(0.6);}60%{transform:scale(1.15);}100%{transform:scale(1);}}
.chk.solved svg{width:13px;height:13px;}
.problem-row a{
  color:var(--text);text-decoration:none;font-size:14px;font-weight:500;flex:1;
  display:flex;align-items:center;gap:6px;
}
.problem-row a:hover{color:var(--accent);}
.problem-row.is-solved a{color:#cfd3da;}
.lock{color:#ffcc00;font-size:12px;}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;flex-shrink:0;}
.badge.Easy{color:var(--easy);background:rgba(0,200,83,0.12);}
.badge.Medium{color:var(--medium);background:rgba(255,171,0,0.12);}
.badge.Hard{color:var(--hard);background:rgba(255,61,90,0.12);}

.state-box{padding:60px 20px;text-align:center;color:var(--text-dim);}
.spinner{
  width:36px;height:36px;border-radius:50%;
  border:3px solid rgba(255,255,255,0.1);border-top-color:var(--accent);
  margin:0 auto 16px;animation:spin .8s linear infinite;
}
.state-box .retry{
  margin-top:14px;background:var(--accent);color:#0a0b0f;font-weight:700;
  padding:9px 20px;border-radius:10px;font-size:13px;
}
.err-text{color:#ff6b81;font-size:13px;margin-top:6px;}
footer{text-align:center;color:var(--text-dim);font-size:12px;margin-top:30px;}
</style>

const SHEETS = {neetcode150:NEETCODE150, blind75:BLIND75};
const SHEET_NAMES = {neetcode150:"NeetCode 150", blind75:"Blind 75"};

/* ---------------- STATE ---------------- */
let solvedSlugs = new Set();
let currentSheet = "neetcode150";
let currentFilter = "all";
let openTopics = new Set();

/* ---------------- FETCH ---------------- */
async function fetchSolved(){
  showLoading();
  try{
    const res = await fetch(PRIMARY_API);
    if(!res.ok) throw new Error("Primary API status " + res.status);
    const data = await res.json();
    const list = data.submission || data.submissions || data || [];
    if(!Array.isArray(list)) throw new Error("Unexpected response shape");
    solvedSlugs = new Set(list.map(s => s.titleSlug).filter(Boolean));
    onFetchSuccess();
  }catch(primaryErr){
    console.warn("Primary API failed:", primaryErr);
    try{
      const query = {
        query: `query recentAcSubmissions($username: String!, $limit: Int!) {
          recentAcSubmissionList(username: $username, limit: $limit) {
            titleSlug
          }
        }`,
        variables:{username:USERNAME, limit:2000}
      };
      const url = FALLBACK_PROXY + encodeURIComponent(LEETCODE_GRAPHQL);
      const res = await fetch(url,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(query)
      });
      if(!res.ok) throw new Error("Fallback API status " + res.status);
      const data = await res.json();
      const list = data?.data?.recentAcSubmissionList || [];
      if(!Array.isArray(list) || list.length===0) throw new Error("No submissions returned from fallback");
      solvedSlugs = new Set(list.map(s=>s.titleSlug).filter(Boolean));
      onFetchSuccess();
    }catch(fallbackErr){
      console.error("Fallback API failed:", fallbackErr);
      showError(primaryErr.message + " / fallback: " + fallbackErr.message);
    }
  }
}

function onFetchSuccess(){
  document.getElementById("loadingBox").style.display="none";
  document.getElementById("errorBox").style.display="none";
  document.getElementById("dashboard").style.display="grid";
  document.getElementById("topicsContainer").style.display="block";
  render();
}

function showLoading(){
  document.getElementById("loadingBox").style.display="block";
  document.getElementById("errorBox").style.display="none";
  document.getElementById("dashboard").style.display="none";
  document.getElementById("topicsContainer").innerHTML="";
}

function showError(msg){
  document.getElementById("loadingBox").style.display="none";
  document.getElementById("errorBox").style.display="block";
  document.getElementById("errMsg").textContent = msg;
  document.getElementById("dashboard").style.display="none";
}

/* ---------------- RENDER ---------------- */
function render(){
  const sheet = SHEETS[currentSheet];
  const container = document.getElementById("topicsContainer");
  container.innerHTML = "";

  let total=0, solved=0, easy=0, medium=0, hard=0;

  Object.entries(sheet).forEach(([topic, problems])=>{
    let topicSolved=0;
    const isOpen = openTopics.has(topic);

    const topicDiv = document.createElement("div");
    topicDiv.className = "topic glass" + (isOpen ? " open":"");

    const head = document.createElement("div");
    head.className = "topic-head";
    head.innerHTML = `
      <div class="left">
        <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 18l6-6-6-6"/></svg>
        <h3>${topic}</h3>
      </div>
      <div class="topic-progress" id="prog-${slug(topic)}"></div>
    `;
    head.addEventListener("click", ()=>{
      if(openTopics.has(topic)) openTopics.delete(topic); else openTopics.add(topic);
      render();
    });

    const barWrap = document.createElement("div");
    barWrap.className = "mini-bar";
    const barFill = document.createElement("div");
    barFill.className = "mini-bar-fill";
    barWrap.appendChild(barFill);

    const listDiv = document.createElement("div");
    listDiv.className = "problem-list";

    problems.forEach(p=>{
      total++;
      const isSolved = solvedSlugs.has(p.titleSlug);
      if(isSolved){ solved++; topicSolved++; }
      if(p.difficulty==="Easy") { if(isSolved) easy++; }
      if(p.difficulty==="Medium") { if(isSolved) medium++; }
      if(p.difficulty==="Hard") { if(isSolved) hard++; }

      const matchesFilter =
        currentFilter==="all" ? true :
        currentFilter==="solved" ? isSolved :
        currentFilter==="unsolved" ? !isSolved :
        currentFilter===p.difficulty;

      const row = document.createElement("div");
      row.className = "problem-row" + (isSolved? " is-solved":"") + (matchesFilter? "":" hidden-row");
      row.innerHTML = `
        <div class="chk ${isSolved?'solved':''}">${isSolved? '<svg viewBox="0 0 24 24" fill="none" stroke="#0a0b0f" stroke-width="4"><path d="M20 6L9 17l-5-5"/></svg>':''}</div>
        <a href="https://leetcode.com/problems/${p.titleSlug}/" target="_blank" rel="noopener">
          ${p.title} ${p.isPremium? '<span class="lock">🔒</span>':''}
        </a>
        <span class="badge ${p.difficulty}">${p.difficulty}</span>
      `;
      listDiv.appendChild(row);
    });

    topicDiv.appendChild(head);
    topicDiv.appendChild(barWrap);
    topicDiv.appendChild(listDiv);
    container.appendChild(topicDiv);

    const pct = problems.length ? Math.round((topicSolved/problems.length)*100) : 0;
    setTimeout(()=>{ barFill.style.width = pct+"%"; },10);
    topicDiv.querySelector(`#prog-${slug(topic)}`).textContent = `${topicSolved}/${problems.length}`;
  });

  // dashboard
  document.getElementById("statTotal").textContent = `${solved}/${total}`;
  document.getElementById("statEasy").textContent = easy;
  document.getElementById("statMedium").textContent = medium;
  document.getElementById("statHard").textContent = hard;

  const pctAll = total? Math.round((solved/total)*100) : 0;
  document.getElementById("ringPct").textContent = pctAll + "%";
  const circumference = 2*Math.PI*65;
  const offset = circumference - (pctAll/100)*circumference;
  const ringFg = document.getElementById("ringFg");
  ringFg.setAttribute("stroke-dasharray", circumference);
  setTimeout(()=>{ ringFg.style.strokeDashoffset = offset; },50);
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

/* ---------------- EVENTS ---------------- */
document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentSheet = btn.dataset.sheet;
    openTopics = new Set();
    render();
  });
});

document.querySelectorAll(".filter-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    render();
  });
});

document.getElementById("refreshBtn").addEventListener("click", ()=>{
  const btn = document.getElementById("refreshBtn");
  btn.classList.add("spinning");
  fetchSolved().finally(()=> btn.classList.remove("spinning"));
});

document.getElementById("retryBtn").addEventListener("click", fetchSolved);

localStorage.setItem("lc_username", USERNAME);

fetchSolved();
</script>
